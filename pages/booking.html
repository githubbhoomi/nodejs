<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now - Royal Events & Catering</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>

</head>

<body>
    <header>
        <div class="logo">🎉 Royal Events & Catering</div>
        <nav>
            <a href="/">Home</a>
            <a href="/events">Events</a>
            <a href="/menu">Menu</a>
            <a href="/booking" class="active">Book Now</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <section class="page-hero">
        <h1>Book Your Event</h1>
        <p>We’ll make your occasion stress-free and special.</p>
    </section>

    <section class="form-section">
        <form action="/booking" method="POST">

            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Phone:</label>
            <input type="tel" name="phone" required>

            <label>Event Type:</label>
            <select name="eventType">
                <option>Birthday Party</option>
                <option>Baby Shower</option>
                <option>Bachelor Party</option>
                <option>Anniversary</option>
            </select>

            <!-- <label>Date:</label>
            <input type="text" id="eventDate" name="eventDate" required> -->
            <label>Date:</label>
            <input type="date" id="eventDate" name="eventDate" required>
            <span id="dateError" style="color:red;"></span>
            <p id="displayDate"></p>


            <label>Message:</label>
            <textarea name="message"></textarea>

            <button type="submit" class="btn primary">Submit Request</button>
        </form>

    </section>

    <footer>
        <p>© 2025 Royal Events & Catering | Designed by Bhoomika 💫</p>
    </footer>
    <script>
        // $(function() {
        //     $("#eventDate").datepicker({
        //         dateFormat: "dd-mm-yy"
        //     });
        // });


        const eventDateInput = document.getElementById("eventDate");
        const dateError = document.getElementById("dateError");
        const displayDate = document.getElementById("displayDate");

        // Set minimum date = today
        const today = new Date().toISOString().split("T")[0];
        eventDateInput.min = today;

        eventDateInput.addEventListener("change", async() => {
            const selectedDate = eventDateInput.value; // value = YYYY-MM-DD
            if (!selectedDate) return;

            // Check locked date from backend
            const res = await fetch(`/api/check-date?date=${selectedDate}`);
            const data = await res.json();

            if (!data.allowed) {
                dateError.textContent = "This date is locked. Please choose another date.";
                eventDateInput.value = "";
                displayDate.textContent = "";
                return;
            }

            // If allowed → show formatted date
            dateError.textContent = "";
            const [yy, mm, dd] = selectedDate.split("-");
            displayDate.textContent = `Selected Date: ${dd}/${mm}/${yy}`;
        });
    </script>


</body>

</html>
