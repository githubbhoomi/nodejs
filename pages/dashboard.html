<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f2f5;
        }

        .navbar {
            background: #2c3e50;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
        }

        .nav-left {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-right a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            margin-left: 20px;
        }

        .container {
            margin: 40px auto;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #0002;
        }

        h2 {
            text-align: center;
        }

        .menu {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .menu a {
            text-decoration: none;
            padding: 12px;
            background: #3498db;
            color: white;
            margin-bottom: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .menu a:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="nav-left">Restaurant Admin Panel</div>

        <!-- Username and logout -->
        <div class="nav-right">
            Logged in as: <b id="user"></b> |
            <a href="/logout">Logout</a>
        </div>
    </div>

    <!-- Dashboard Box -->
    <div class="container">
        <h2>Welcome to Dashboard</h2>
        <p style="text-align:center;">Choose an option</p>

        <div class="menu">

            <a href="/add-user-page" id="addUserBtn">➕ Add User</a>
            <a href="/addmenu" id="addMenuBtn">🍽️ Add Menu Item</a>
            <a href="/menu">📋 View Menu Items</a>
        
        </div>
        
    </div>

    <script>
        fetch("/session-user")
            .then(res => res.json())
            .then(data => {
                document.getElementById("user").textContent = data.username;
                console.log(data.role)
                // Show only admin features if user is admin
                if (data.role !== "admin") {
                    // Hide Admin-only buttons
                    document.getElementById("addUserBtn").style.display = "none";
                    document.getElementById("addMenuBtn").style.display = "none";
                }
            });
    </script>
    

</body>
</html>
